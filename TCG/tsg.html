<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpogames | Figuras & TCG</title>
    <link rel="stylesheet" href="../home/style.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="logo" id="mainLogo" onclick="window.location.href='index.html'">Pulpogames</h1>
        <div class="search-wrapper">
            <input type="text" id="searchBar" placeholder="Buscar figuras o cartas...">
        </div>
        <div class="nav-actions">
            <button id="loginBtn" class="action-icon">👤</button>
            <div class="cart-wrapper">
              
    
        </div>
        
    </header>
    
  <!-- Puedes agregar más capas (slides) aquí -->
</div>
   </head>
<body>

<div class="slider" id="slider">
  <div class="slides" id="slides">
    <img src="https://www.latercera.com/resizer/v2/6LUNYLIQRFC3THXJUZCRVXVZHI.jpg?auth=f8fe920a6ad263e4ca550ad50972be506dea57f6cf5f388a2f3f625a7d762211&smart=true&width=800&height=450&quality=70">
    <img src="https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2024/11/07/6903f021274bb.jpeg">
    <img src="https://www.konami.com/kde_cms/eu_publish/uploads/lost_art_cards_es-600x322.png">
  </div>

  <button id="prev">❮</button>
  <button id="next">❯</button>
</div>
  <!-- Botones de filtro -->
  <div class="filtros">
    <button class="btn-filtro">Todos</button>
    <button class="btn-filtro">cartas </button>
     <button class="btn-filtro">figuras</button>
  </div>


  <div class="container">
    <!-- Cuadrícula de productos -->
    <div id="productGrid" class="grid"></div>

    <!-- Barra lateral del carrito -->
    <div class="cart">
      <h3>🛒 Carrito (<span id="count">0</span>)</h3>
      <div id="cartItems"></div>
      <div class="total">
        Total: <span id="subtotal">$0</span>
      </div>
      <button class="finalizar-compra">Finalizar compra</button>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div id="overlay" class="overlay" style="display:none;">
    <div class="modal">
      <div class="check">✔</div>
      <h2>¡Pedido confirmado!</h2>
      <p id="mensajePedido"></p>
      <button onclick="cerrarModal()">Seguir comprando</button>
    </div>
  </div>

    <script src="14.js"></script>
    <script src="../home/main.js"></script>
</body>
</html>
