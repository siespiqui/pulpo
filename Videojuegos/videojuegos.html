<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpogames | Tienda de Videojuegos</title>
    <link rel="stylesheet" href="../home/style.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="logo" id="mainLogo" onclick="window.location.href='index.html'">Pulpogames</h1>
        <div class="search-wrapper">
            <input type="text" id="searchBar" placeholder="Buscar títulos...">
        </div>
        <div class="nav-actions">
            <button id="loginBtn" class="action-icon">👤</button>
            <div class="cart-wrapper">
                <button id="cartBtn" class="action-icon">🛒</button>
                <span id="cartCount">0</span>
            </div>
        </div>
    </header>

    <main class="store-layout">
        <div class="section-title">
            <h2>Catálogo Destacado</h2>
            <p>8 títulos imprescindibles para tu colección</p>
        </div>

        <div class="game-grid">
            <div class="game-card">
                <div class="badge-price">NEW</div>
                <img src="https://via.placeholder.com/200x250" alt="Juego 1">
                <div class="game-info">
                    <h3>The Legend of Zelda</h3>
                    <span class="price">280.000 COP</span>
                    <button class="add-to-cart" onclick="addToCart('Zelda', 280000)">Añadir al Carrito</button>
                </div>
            </div>

            <div class="game-card">
                <img src="https://via.placeholder.com/200x250" alt="Juego 2">
                <div class="game-info">
                    <h3>Halo Infinite</h3>
                    <span class="price">220.000 COP</span>
                    <button class="add-to-cart" onclick="addToCart('Halo', 220000)">Añadir al Carrito</button>
                </div>
            </div>
            
            </div>
    </main>

    <div id="sideCart" class="side-drawer">
        <div class="drawer-header"><h3>Carrito</h3><button id="closeCart">X</button></div>
        <div id="cartItems"></div>
        <button class="checkout-btn">Finalizar Compra</button>
    </div>

    <script src="../home/main.js"></script>
</body>
</html>
