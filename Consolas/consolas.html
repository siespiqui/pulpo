<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpogames | Hardware & Plan Renace</title>
    <link rel="stylesheet" href="../home/style.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 class="logo" id="mainLogo" onclick="window.location.href='index.html'">Pulpogames</h1>
        <div class="search-wrapper">
            <input type="text" id="searchBar" placeholder="¿Qué consola buscas?">
        </div>
        <div class="nav-actions">
            <button id="loginBtn" class="action-icon">👤</button>
            <div class="cart-wrapper">
                <button id="cartBtn" class="action-icon">🛒</button>
                <span id="cartCount">0</span>
            </div>
        </div>
    </header>

    <main class="consoles-page">
        <section class="trade-in-hero">
            <div class="hero-text">
                <h1>PLAN RENACE 🔄</h1>
                <p>No dejes que tu consola vieja coja polvo. <strong>La recibimos en parte de pago</strong> para que te lleves la nueva generación hoy mismo.</p>
                <button class="cta-button" onclick="window.location.href='https://wa.me/tu-numero'">Cotizar mi Consola</button>
            </div>
            <div class="hero-image">
                <div class="console-box">NEW GEN</div>
            </div>
        </section>

        <section class="hardware-info">
            <h2>Hardware y Accesorios Disponibles</h2>
    
  <!-- Botones de filtro -->
  <div class="filtros">
    <button class="btn-filtro">Todos</button>
    <button class="btn-filtro">xbox</button>
    <button class="btn-filtro">playstation</button>
    <button class="btn-filtro">nintendo</button>
     <button class="btn-filtro">accesorios</button>
  </div>


  <div class="container">
    <!-- Cuadrícula de productos -->
    <div id="productGrid" class="grid"></div>

    <!-- Barra lateral del carrito -->
    <div class="cart">
      <h3>🛒 Carrito (<span id="count">0</span>)</h3>
      <div id="cartItems"></div>
      <div class="total">
        Total: <span id="subtotal">$0</span>
      </div>
      <button class="finalizar-compra">Finalizar compra</button>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div id="overlay" class="overlay" style="display:none;">
    <div class="modal">
      <div class="check">✔</div>
      <h2>¡Pedido confirmado!</h2>
      <p id="mensajePedido"></p>
      <button onclick="cerrarModal()">Seguir comprando</button>
    </div>
  </div>

    <script src="../home/main.js"></script>
    <script src="Untitled-1.js"></script>
</body>
</html>
